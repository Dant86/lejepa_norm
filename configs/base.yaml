# Base config: starting defaults from the technical design (tuned in M2).
# Per-variant / per-experiment configs override only what differs.
seed: 0
data:
  num_global_views: 2
  num_local_views: 4
  global_size: 96
  local_size: 48
  global_scale: [0.3, 1.0]
  local_scale: [0.05, 0.3]
  num_workers: 8  # prepare_data build only; train/embed augment on the GPU
  mean: [0.4409, 0.4279, 0.3868]
  std: [0.2683, 0.2610, 0.2687]
  corruptions:
    [gaussian_noise, shot_noise, impulse_noise, speckle_noise, gaussian_blur,
     defocus_blur, contrast, brightness, jpeg_compression, pixelate]
  severities: [1, 2, 3, 4, 5]
  corruption_seed: 0
  full_corruption_set: false
model:
  backbone: resnet18
  reduced_stem: false
  projector_hidden: [2048, 2048]
  embed_dim: 256
loss:
  variant: A
  lambda: 0.05
  num_slices: 1024
  num_points: 17
  t_max: 3.0
train:
  batch_size: 256
  epochs: 200
  warmup_epochs: 10
  lr: 5.0e-4
  weight_decay: 0.05
  precision: bf16
  log_every_steps: 50
  knn_every_epochs: 10
  checkpoint_every_epochs: 10
eval:
  num_views: 8
  batch_size: 256
  knn_k: 20
  cv_folds: 5
  num_bootstrap: 1000
  max_kernel_images: 4000
  # Permutations of the radius in the redundancy controls (`analyze --redundancy-controls`).
  num_permutations: 500
