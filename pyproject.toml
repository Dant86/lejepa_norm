[project]
name = "lejepa-norm"
version = "0.1.0"
description = "Studying the role of the embedding radius in LeJEPA."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "kaleido>=1.0",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "plotly>=7.1.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "scikit-image>=0.26.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "timm>=1.0.30",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
]

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pyright>=1.1.390",
    "pytest>=8.0",
    "ruff>=0.8",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lejepa_norm"]

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src", "apps", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "D",   # pydocstyle
    "B",   # bugbear
    "UP",  # pyupgrade
    "TID", # tidy imports
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
# Google style: one import per line, modules only (see scripts/check_imports.py).
force-single-line = true
force-sort-within-sections = true

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = ["src", "apps", "tests", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: multi-process tests (real-signal subprocesses, pipeline smoke); deselect with -m \"not slow\"",
]
